<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai-agent-acc - الوكيل الذكي للمحاسبة المالية</title>
    <link rel="stylesheet" href="widget.css">
</head>
<body class="ai-accounting-system-body">

    <!-- زر المساعد العائم -->
    <div id="ai-floating-btn" class="launcher-btn" onclick="toggleModal()">
        <span>ai-agent-acc</span> 🛍️
    </div>

    <!-- نافذة المساعد المنبثقة -->
    <div id="ai-modal-box" class="modal-box" style="display: none;">
        <div class="widget-header">
            <h3>مساعد المحاسبة الذكي (TaaS)</h3>
            <button onclick="toggleModal()" class="close-btn">✕</button>
        </div>
        <div class="widget-body">
            <div id="results-container" class="results-area">
                <p>أهلاً بكِ. جاهز لاستقبال العمليات المحاسبية وقاموس المعالجة...</p>
            </div>
            <div class="input-area" style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" id="transaction-text" placeholder="اكتب الاستفسار المحاسبي هنا..." style="flex-grow: 1; padding: 8px;">
                <button onclick="processAccountingTransaction()" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">إرسال</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
