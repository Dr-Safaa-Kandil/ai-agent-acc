<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai-agent-acc - الوكيل الذكي للمحاسبة المالية</title>
    <link rel="stylesheet" href="css/widget.css">
</head>
<body>
    <div class="ai-widget-container">
        <!-- زر فتح/إغلاق النافذة -->
        <button id="launcher-btn" class="launcher-btn">Smart Accounting Assistant</button>

        <!-- نافذة المحادثة والتحليل المحاسبي -->
        <div id="modal-box" class="modal-box" style="display: none;">
            <div class="modal-header">
                <span>المساعد المحاسبي الذكي</span>
                <button id="close-btn">إغلاق</button>
            </div>

            <!-- رسالة الترحيب -->
            <div class="welcome-container">
                <p>مرحباً بك دكتورة صفاء. نظام المعالجة والتحليل المحاسبي الثنائي جاهز.</p>
            </div>

            <!-- شريط أسعار العملات -->
            <div class="exchange-info-bar">
                <span>أسعار الصرف المحدثة</span>
                <span id="exchange-rates-status">متصل (EUR/USD/EGP)</span>
            </div>

            <!-- صف العملات الأجنبية المدمج (مع زر التحويل للجنيه المصري) -->
            <div class="foreign-currency-row">
                <button id="convert-currency-btn" type="button">تحويل للجنيه</button>
                <input type="number" id="amount-input" placeholder="المبلغ" />
                <select id="currency-select">
                    <option value="EGP">Egypt (EGP)</option>
                    <option value="USD">US Dollar (USD)</option>
                    <option value="EUR">Euro (EUR)</option>
                </select>
            </div>

            <!-- صف نتيجة التحويل -->
            <div class="foreign-result-row">
                <input type="text" id="conversion-result-input" placeholder="نتائج التحويل للعملة المحلية..." disabled />
            </div>

            <!-- صف بيان المعاملة الأجنبية -->
            <div class="foreign-note-row">
                <input type="text" id="foreign-note-input" placeholder="بيان المعاملة أو الدولة الأجنبية..." />
            </div>

            <!-- أداة التحرير السريع -->
            <div class="whatsapp-editor-box">
                <div class="editor-toolbar">
                    <button type="button" id="copy-btn">نسخ</button>
                    <button type="button" id="paste-btn">لصق</button>
                    <button type="button" id="import-btn">استيراد</button>
                </div>
            </div>

            <!-- قسم إدخال المعاملة المحلية -->
            <div class="local-tx-section">
                <textarea id="tx-input" placeholder="اكتب المعاملة المالية هنا..."></textarea>
            </div>

            <!-- صندوق الأمثلة بالتنسيق المطلوب والدقيق -->
            <div class="examples-box">
                <p>مثال: 1000 جنيه مصروف إيجار تشغيلي / أتعاب استشارات / شراء أدوات</p>
            </div>

            <!-- زر الإرسال للمعالجة -->
            <div class="submit-action-row">
                <button id="send-tx-btn" class="send-text-btn">إرسال المعالجة التحليلية الثنائية ←</button>
            </div>

            <!-- أزرار الإدخال المساعد (صوت، صورة، OCR) -->
            <div class="actions-section">
                <button type="button" id="voice-btn">تسجيل صوتي</button>
                <button type="button" id="image-btn">رفع صورة</button>
                <button type="button" id="ocr-btn">مسح ضوئي OCR</button>
            </div>

            <!-- منطقة عرض النتائج التحليلية -->
            <div id="result-area" class="result-area" style="display: none;">
                <div class="result-badge">النتائج التحليلية الفورية وقاموس المعالجة:</div>
                <div id="result-content"></div>
            </div>

            <!-- أزرار التصدير والحفظ الثلاثة -->
            <div class="persistence-options">
                <button type="button" id="save-db-btn">تسجيل بقاعدة بيانات ai-acc</button>
                <button type="button" id="export-sheets-btn">تصدير إلى Google Sheet</button>
                <button type="button" id="export-excel-btn">تصدير إلى Excel 365</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
