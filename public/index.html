<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent for Financial Accounting - TaaS</title>
    <link rel="stylesheet" href="css/widget.css">
</head>
<body>
    <div id="ai-cost-assistant-widget" class="ai-widget-container">
        <!-- زر الإطلاق بأيقونة الحقيبة -->
        <button id="ai-launcher-btn" class="launcher-btn">
            🛍️ <span id="launcher-text">المساعد المحاسبي</span>
        </button>
        
        <!-- النافذة المنسدلة التفاعلية -->
        <div id="ai-modal-box" class="modal-box" style="display: none;">
            <div class="modal-header">
                <span id="header-title">الوكيل الذكي للمحاسبة المالية</span>
                <button id="lang-toggle-btn">En / Ar</button>
            </div>
            
            <!-- رسالة الترحيب الأنسب -->
            <div id="welcome-msg-container" class="welcome-container">
                <p id="welcome-text">مرحباً أنا وكيلك الذكي لتسجيل المعاملات المالية فورياً.</p>
            </div>

            <!-- شريط التاريخ وأسعار الصرف الحية -->
            <div class="exchange-info-bar">
                <span id="current-date-display">التاريخ: 2026-09-29</span>
                <span id="exchange-rate-display">دولار/عملة: --</span>
            </div>

            <!-- إعدادات الضبط والعملات -->
            <div class="controls-section">
                <select id="country-currency-select">
                    <option value="EGY">مصر (ج.م - بدون سعر صرف)</option>
                    <option value="SAU">السعودية (ريال سعودي - تحويل لجنيه)</option>
                    <option value="ARE">الإمارات (درهم إماراتي - تحويل لجنيه)</option>
                    <option value="USD">دولار أمريكي (تحويل لجنيه)</option>
                </select>
            </div>

            <!-- وحدة الآلة الحاسبة للتحويل المعزز -->
            <div class="calc-section">
                <input type="number" id="foreign-amount-input" placeholder="أدخل المبلغ بالعملة الأجنبية...">
                <button id="calc-convert-btn">🧮 احسب الناتج بالجنيه المصري</button>
            </div>

            <!-- محرر النصوص المباشر (يشبه محرر واتساب) -->
            <div class="whatsapp-editor-box">
                <div class="editor-toolbar">
                    <button title="تراجع" id="undo-btn">↩️</button>
                    <button title="نسخ" id="copy-btn">📋</button>
                    <button title="لصق" id="paste-btn">📌</button>
                    <button title="إرفاق واتساب/رسالة" id="whatsapp-import-btn">💬 استيراد واتساب</button>
                </div>
                <textarea id="manual-tx-textarea" placeholder="اكتب أو الصق المعاملة المالية هنا (مثال: شراء بضاعة 4000 جنيه)..."></textarea>
                <button id="submit-text-tx-btn" class="send-text-btn">إرسال النص للمعالجة ➔</button>
            </div>

            <!-- أزرار الوسائط (صوت / مسح ضوئي) -->
            <div class="actions-section">
                <button id="record-audio-btn">🎤 تسجيل صوتي / واتساب</button>
                <button id="scan-doc-btn">📷 مسح ضوئي / صورة</button>
            </div>

            <!-- شاشة عرض النتائج والمخرجات التحليلية -->
            <div id="result-display-area" class="result-area" style="display: none;">
                <div class="result-badge">النتائج التحليلية الفورية:</div>
                <div class="result-row"><strong>المبلغ المستخرج/الناتج:</strong> <span id="res-amount">0.00</span> ج.م</div>
                <div class="result-row"><strong>الجانب المدين:</strong> <span id="res-debit">--</span></div>
                <div class="result-row"><strong>الجانب الدائن:</strong> <span id="res-credit">--</span></div>
            </div>

            <!-- خيارات الرصد والترحيل (قاعدة البيانات، جوجل شيت GAS، أو إكسل Office Scripts) -->
            <div class="persistence-options">
                <button id="save-live-db">رصد لحظي (قاعدة البيانات)</button>
                <button id="save-sheets-gas">ترحيل (Google Sheets - GAS)</button>
                <button id="save-excel-script">ترحيل (Excel 365 - Office Script)</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/recorder.js"></script>
</body>
</html>
